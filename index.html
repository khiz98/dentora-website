<!doctype html>
<html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Dentora dental clinic - multilingual appointments"><title>Dentora Dental Clinic</title><link rel="stylesheet" href="style.css"></head>
<body><header class="nav"><a href="#home" class="brand">✳ dentora<span>.</span></a><nav><a href="#services" data-i="services"></a><a href="#team" data-i="doctors"></a><a href="#about" data-i="about"></a><a href="#contact" data-i="contact"></a></nav><div class="nav-actions"><select id="language" aria-label="Language"><option value="tg">🇹🇯 Тоҷикӣ</option><option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option></select><a class="button" href="#booking" data-i="book"></a></div></header>
<main><section class="hero" id="home"><div><div class="eyebrow" data-i="welcome"></div><h1><span data-i="hero1"></span><br><span data-i="hero2"></span><br><em data-i="hero3"></em></h1><p data-i="intro"></p><a class="button" href="#booking" data-i="book"></a><div class="stats"><div><strong>10+</strong><small data-i="years"></small></div><div><strong>5k+</strong><small data-i="patients"></small></div><div><strong>4</strong><small data-i="specialists"></small></div></div></div><img src="https://images.unsplash.com/photo-1606811971618-4486d14f3f99?w=1000&auto=format&fit=crop" alt="Dental care"></section>
<section id="services" class="section"><div class="eyebrow" data-i="services"></div><h2 data-i="servicesTitle"></h2><p class="sub" data-i="servicesIntro"></p><div id="serviceCards" class="cards"></div></section>
<section id="team" class="section tint"><div class="eyebrow" data-i="doctors"></div><h2 data-i="teamTitle"></h2><p class="sub" data-i="teamIntro"></p><div id="doctorCards" class="cards"></div></section>
<section id="booking" class="section booking"><div class="eyebrow" data-i="online"></div><h2 data-i="bookingTitle"></h2><p class="sub" data-i="bookingIntro"></p><div class="panel"><div class="fields"><label><span data-i="treatment"></span><select id="service"></select></label><label><span data-i="date"></span><input id="date" type="date"></label><label><span data-i="doctor"></span><select id="doctor"></select></label></div><h3 data-i="availableDoctors"></h3><div id="availableDoctors" class="choices"></div><h3 data-i="availableTimes"></h3><div id="slots" class="slots"></div><p class="sub" id="slotHelp"></p><hr><h3 data-i="patientInfo"></h3><form id="appointment"><div class="fields"><label><span data-i="fullName"></span><input id="fullName" required maxlength="100" autocomplete="name"></label><label><span data-i="phone"></span><input id="phone" type="tel" required minlength="7" maxlength="25" placeholder="+992 900 00 00 00" autocomplete="tel"></label><label><span data-i="email"></span><input id="email" type="email" autocomplete="email"></label></div><label class="notes"><span data-i="notes"></span><textarea id="notes" maxlength="500" rows="2"></textarea></label><label class="consent"><input type="checkbox" required><span data-i="consent"></span></label><div class="submit"><span id="summary" aria-live="polite"></span><button class="button" type="submit" data-i="request"></button></div></form><div id="confirmation" role="status" aria-live="polite" hidden></div></div></section>
<section id="about" class="section"><div class="eyebrow" data-i="about"></div><h2 data-i="aboutTitle"></h2><p class="sub" data-i="aboutText"></p></section></main>
<footer id="contact"><div><h2>✳ dentora.</h2><p data-i="tagline"></p></div><div><h3 data-i="contact"></h3><p>Dushanbe, Tajikistan (demo)<br>+992 XX XXX XX XX<br>hello@example.com</p></div><div><h3 data-i="hours"></h3><p data-i="schedule"></p></div><small data-i="disclaimer"></small></footer><script src="app.js" defer></script></body></html>
